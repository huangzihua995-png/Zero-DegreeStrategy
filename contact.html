<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系交流 | 零度策略</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    :root {
      --bg-primary: #070a10;
      --bg-secondary: #0d131f;
      --bg-card: rgba(15, 23, 42, 0.85);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(0, 240, 255, 0.3);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --cyan: #00f0ff;
      --emerald: #10b981;
      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: "JetBrains Mono", Consolas, Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(0, 240, 255, 0.05) 0%, transparent 50%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
    }
    a { text-decoration: none; color: inherit; }

    .navbar {
      position: sticky; top: 0; z-index: 1000;
      background: rgba(7, 10, 16, 0.88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
    }
    .nav-container {
      max-width: 1240px; margin: 0 auto; padding: 1.1rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-brand {
      display: flex; align-items: center; gap: 12px;
      font-weight: 800; font-size: 1.2rem; color: #ffffff;
    }
    .brand-logo { height: 32px; width: auto; }
    .brand-badge {
      font-size: 0.72rem; font-family: var(--font-mono);
      background: rgba(0, 240, 255, 0.12); color: var(--cyan);
      padding: 3px 8px; border-radius: 4px; border: 1px solid rgba(0, 240, 255, 0.3);
    }
    .nav-links { display: flex; gap: 2.2rem; list-style: none; }
    .nav-links a { font-size: 0.92rem; color: var(--text-muted); font-weight: 500; }
    .nav-links a:hover, .nav-links a.active { color: var(--cyan); }

    .contact-container {
      flex: 1; max-width: 760px; margin: 4.5rem auto; padding: 0 2rem;
      width: 100%; text-align: center;
    }
    .contact-box {
      background: var(--bg-secondary); border: 1px solid var(--border-glow);
      border-radius: 16px; padding: 3.5rem 2.5rem;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5), 0 0 35px rgba(0, 240, 255, 0.08);
    }
    .email-display {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bg-primary); border: 1px solid var(--border-subtle);
      border-radius: 8px; padding: 1.1rem 1.5rem; margin: 2rem 0;
      font-family: var(--font-mono); font-size: 1.15rem; color: var(--cyan); font-weight: 700;
    }
    .copy-btn {
      background: var(--cyan); color: #070a10; border: none; padding: 0.65rem 1.4rem;
      border-radius: 6px; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: all 0.2s;
    }
    .copy-btn:hover { background: #67e8f9; transform: scale(1.02); }

    .site-footer { border-top: 1px solid var(--border-subtle); background: #04060a; padding: 2.5rem 2rem; }
    .footer-inner {
      max-width: 1240px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;
      font-size: 0.88rem; color: #64748b;
    }
    .footer-links { display: flex; gap: 2rem; }
    .footer-links a { color: #94a3b8; }
    .footer-links a:hover { color: var(--cyan); }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .email-display { flex-direction: column; gap: 1rem; }
      .footer-inner { flex-direction: column; gap: 1rem; text-align: center; }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-brand">
        <img src="logo.png" alt="零度策略" class="brand-logo" onerror="this.style.display='none'">
        <span>零度策略</span>
        <span class="brand-badge">DERIVATIVES LAB</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">首页概述</a></li>
        <li><a href="solutions.html">服务体系</a></li>
        <li><a href="about.html">研究方法论</a></li>
        <li><a href="contact.html" class="active">联系交流</a></li>
      </ul>
    </div>
  </header>

  <main class="contact-container">
    <div class="contact-box">
      <div style="font-family: var(--font-mono); color: var(--cyan); font-size: 0.82rem; letter-spacing: 0.08em; margin-bottom: 0.8rem;">
        GET IN TOUCH // 官方渠道
      </div>
      <h1 style="font-size: 2.2rem; color: #ffffff; font-weight: 900; margin-bottom: 1rem;">开启专业沟通与交流</h1>
      <p style="color: var(--text-muted); font-size: 1rem; line-height: 1.8; max-width: 580px; margin: 0 auto;">
        如果您对 BTC/USDT 期权衍生品量化策略、风控咨询或定制实战课程感兴趣，欢迎通过官方联络邮箱与我们取得联系。
      </p>

      <div class="email-display">
        <span id="emailTarget">hr@zero-degreestrategy.com</span>
        <button class="copy-btn" id="copyBtn">一键复制邮箱</button>
      </div>

      <div style="font-size: 0.85rem; color: #64748b;">
        所有咨询往来均予以保密，技术与研究团队通常会在 24 小时内回复。
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div>零度策略 · 专注于加密衍生品策略研究、风险管理与教育赋能</div>
      <div class="footer-links">
        <a href="index.html">首页概述</a>
        <a href="solutions.html">服务体系</a>
        <a href="about.html">研究方法论</a>
      </div>
    </div>
  </footer>

  <script>
    document.getElementById("copyBtn").addEventListener("click", function() {
      const email = document.getElementById("emailTarget").innerText.trim();
      navigator.clipboard.writeText(email).then(() => {
        const btn = document.getElementById("copyBtn");
        const oldText = btn.innerText;
        btn.innerText = "已复制 ✓";
        btn.style.background = "#10b981";
        btn.style.color = "#ffffff";
        setTimeout(() => {
          btn.innerText = oldText;
          btn.style.background = "";
          btn.style.color = "";
        }, 2200);
      });
    });
  </script>
</body>
</html>
