<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zero Degree Strategy</title>
  <!-- 引入 Tailwind CSS 快速排版 -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased flex flex-col min-h-screen">

  <!-- 顶部导航 -->
  <header class="max-w-4xl mx-auto w-full px-6 py-8 flex justify-between items-center">
    <div class="font-bold text-xl tracking-tight text-slate-900">Zero Degree</div>
    <nav class="space-x-6 text-sm font-medium text-slate-600">
      <a href="#about" class="hover:text-blue-600 transition">关于</a>
      <a href="#projects" class="hover:text-blue-600 transition">项目</a>
     
    </nav>
  </header>

  <!-- 核心展示区 (Hero) -->
  <main class="max-w-4xl mx-auto w-full px-6 py-16 flex-grow">
    <div class="space-y-6">
      <h1 class="text-4xl sm:text-5xl font-extrabold text-slate-900 leading-tight">
        探索策略与创新的无限可能
      </h1>
      <p class="text-lg text-slate-600 max-w-2xl leading-relaxed">
        欢迎来到 Zero Degree Strategy。这里专注于分享深度思考、项目沉淀以及前沿技术方案。
      </p>
      <div class="pt-4 flex gap-4">
        <a href="#projects" class="px-5 py-3 rounded-xl bg-blue-600 text-white font-medium hover:bg-blue-700 transition shadow-sm">
          查看项目
        </a>
        <a href="https://github.com/huangzihua995-png" target="_blank" class="px-5 py-3 rounded-xl bg-slate-200 text-slate-700 font-medium hover:bg-slate-300 transition">
          GitHub 主页
        </a>
      </div>
    </div>

    <!-- 内容卡片区 -->
    <section id="projects" class="mt-20">
      <h2 class="text-2xl font-bold text-slate-900 mb-6">精选项目</h2>
      <div class="grid sm:grid-cols-2 gap-6">
        <div class="p-6 bg-white border border-slate-200 rounded-2xl shadow-sm hover:shadow-md transition">
          <h3 class="font-semibold text-lg text-slate-900 mb-2">项目名称 01</h3>
          <p class="text-slate-600 text-sm leading-relaxed mb-4">
            简要介绍该项目的目标、解决的问题以及核心特色。
          </p>
          <span class="text-xs font-semibold px-2.5 py-1 bg-slate-100 text-slate-600 rounded-md">Web / AI</span>
        </div>
        <div class="p-6 bg-white border border-slate-200 rounded-2xl shadow-sm hover:shadow-md transition">
          <h3 class="font-semibold text-lg text-slate-900 mb-2">项目名称 02</h3>
          <p class="text-slate-600 text-sm leading-relaxed mb-4">
            简要介绍该项目的目标、解决的问题以及核心特色。
          </p>
          <span class="text-xs font-semibold px-2.5 py-1 bg-slate-100 text-slate-600 rounded-md">Strategy</span>
        </div>
      </div>
    </section>
  </main>

  <!-- 页脚 -->
  <footer class="max-w-4xl mx-auto w-full px-6 py-8 border-t border-slate-200 text-center text-sm text-slate-500">
    &copy; 2026 Zero Degree Strategy. All rights reserved.
  </footer>

</body>
</html>
